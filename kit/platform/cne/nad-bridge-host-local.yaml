apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ${NAD_NAME}
  namespace: ${NAMESPACE}
  annotations:
    # FLO's TMM-template propagation expects a resourceName on the NAD
    # (the SR-IOV convention). Bridge CNI has no hardware behind it, so
    # this is a documentary stand-in that silences a reconcile warning.
    k8s.v1.cni.cncf.io/resourceName: bridge.cni.io/${NAD_NAME}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "${BRIDGE}",
      "ipMasq": false,
      "isGateway": false,
      "hairpinMode": true,
      "ipam": {
        "type": "host-local",
        "subnet": "${SUBNET}",
        "rangeStart": "${RANGE_START}",
        "rangeEnd": "${RANGE_END}"
      }
    }
