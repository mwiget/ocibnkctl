# Gateway WITHOUT spec.addresses — the controller must allocate one from
# the GatewaySettings' IPAM pool (Infra.ipams bnk-dynamic-vips). The
# infrastructure.parametersRef binds to the GatewaySettings in the same
# namespace (group gateway.k8s.f5.com, kind GatewaySettings — the BNK 2.4
# shape; 2.3 pointed this at an F5BnkGateway).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: scn-fic-gateway
  namespace: scn-fic-dyn
spec:
  gatewayClassName: bnk-gatewayclass
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: ocibnkctl-fic
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: {from: Same}
