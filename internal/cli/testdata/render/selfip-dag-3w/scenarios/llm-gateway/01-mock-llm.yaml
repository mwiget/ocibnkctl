# A GPU-free, OpenAI-compatible LLM for the demo: llm-d-inference-sim answers
# /v1/chat/completions for the model named in --model with deterministic but
# varying usage blocks, so token metering has real numbers to count. It never
# checks the API key, so the provider key the gateway sends it is a dummy.
apiVersion: v1
kind: Namespace
metadata:
  name: llm-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: llm-demo
  labels: {app: mock-llm}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-llm}
  template:
    metadata:
      labels: {app: mock-llm}
    spec:
      containers:
      - name: inference-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.0
        args: ["--model=gpt-4o-mini", "--port=8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 2
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: llm-demo
spec:
  selector: {app: mock-llm}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
