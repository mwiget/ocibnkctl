# backendRef kind InferencePool (not Service) is what turns on inference
# routing in TMM: each matching request triggers an ext_proc consult to the
# pool's EPP. A rule must reference exactly one InferencePool and nothing
# else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scn-epp-route
  namespace: scn-epp
spec:
  parentRefs:
  - name: scn-epp-gateway
  hostnames:
  - epp.ocibnkctl.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /v1}
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: llm-pool
      port: 8000
