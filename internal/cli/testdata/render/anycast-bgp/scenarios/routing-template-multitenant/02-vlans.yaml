apiVersion: k8s.f5net.com/v1
kind: F5SPKVlan
metadata:
  name: tenant-red
  namespace: default
spec:
  name: tenant-red
  interfaces: ["1.1"]
  tag: 2001
  vrf: red
  mtu: 1500
  prefixlen_v4: 24
  prefixlen_v6: 112
  selfip_v4s:
    - "198.51.100.11"
  selfip_v6s:
    - "2001:db8:1::11"
