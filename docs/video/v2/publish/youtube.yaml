description: |
  ocibnkctl deploys a full F5 BIG-IP Next for Kubernetes 2.4.0 stack on plain
  Docker, one host, no kind, no k3d, no DPU. Here a live Claude Code session,
  running on a local model (Qwen3.8 27B served by llama.cpp, so nothing leaves
  the machine), drives it end to end: scaffold, doctor, license keys, deploy,
  15 of 15 F5 how-to scenarios green, bnkscope, and a clean teardown.

  Nothing is staged. The first deploy attempt really did hit a subnet already
  owned by another lab on the same host; the agent found the network holding
  it, left it alone, moved to a free subnet and resumed.

  https://github.com/mwiget/ocibnkctl

